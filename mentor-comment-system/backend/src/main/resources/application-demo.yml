# ============================================================================
# demo profile —— 零依赖启动，无需安装 MySQL
# 用途：答辩演示 / 快速验证 / 本地开发
# 启动：mvn spring-boot:run -Dspring-boot.run.profiles=demo
#     或 java -jar mentor-comment-backend.jar --spring.profiles.active=demo
# ============================================================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    # DB_CLOSE_DELAY=-1 让内存库在连接池切换时不被销毁
    url: jdbc:h2:mem:mentor_comment;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,KEY
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      # 内存库每次启动都要重建，schema 必须一次成功。关掉 continue-on-error：
      # 上一版把它设成 true，结果 schema 缺列（action_type/withdrawn_at）被静默吞掉，
      # 报错现场出现在几层调用之后，排查成本远高于直接启动失败。
      continue-on-error: false
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# demo profile 才打开演示能力：灌种子数据 + 登录页展示演示账号
app:
  demo-seed:
    enabled: true

logging:
  level:
    com.graduation.mentor: info
