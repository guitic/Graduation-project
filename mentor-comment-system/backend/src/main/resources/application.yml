server:
  port: 8090
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: mentor-comment-system
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always
  # 默认连接 MySQL。
  # 注意：建表脚本 db/schema.sql 是「先 drop 再 create」的重置脚本，若交给 spring.sql.init 自动执行，
  # 每次重启都会清空业务数据（且不报错，只是数据没了）。因此默认 profile 关闭自动初始化：
  # 首次部署手动执行 `mysql -u root -p mentor_comment < sql/schema.sql`，
  # 演示环境用 demo profile（H2 内存库，每次启动本就重建）。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mentor_comment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# Sa-Token 鉴权
sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 统计最小样本量（隐私门槛）
# 只有一个 key：同时作用于 饼图 / 趋势（图级+桶级）/ 词云 / 明细下钻。
# 不设"词云 3、情感 5"这类不对称配置——2~4 条点评的高频词几乎就是原文关键词，
# 放宽门槛收益为零、风险不为零。答辩现场把 5 改成 6，四张图必须同时变化。
analysis:
  min-sample: 5

# 演示能力总开关：种子数据（DemoDataInitializer）与登录页演示账号（/api/demo/accounts）都受它控制。
# 默认关闭——真实环境里出现 70 条演示点评、或匿名接口返回"统一密码"，都是事故而不是便利。
app:
  demo-seed:
    enabled: false

  # 大模型摘要（可选增强）。
  # 默认关闭：关闭时走规则实现，功能完整、结果可解释；开启后才有模型参与。
  # 端点兼容任意 OpenAI 协议（DeepSeek / 通义 / 自建 vLLM），改 base-url 即可。
  # 密钥只从环境变量读，绝不写进仓库：
  #   Windows PowerShell: $env:AI_ENABLED="true"; $env:AI_API_KEY="sk-xxx"; mvn spring-boot:run
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    connect-timeout-seconds: 3
    read-timeout-seconds: 10
    temperature: 0.2
    max-input-chars: 1200
    max-output-chars: 600
    # 小助手对话限流（按用户，内存滑动窗口）。
    # Key 是教务配的、全系统共用一份配额，没有限流时一个脚本就能把额度刷完。
    chat:
      per-minute: 12
      per-day: 150

  # 师生档案维护：新建账号的初始密码。
  # 只在创建 / 重置密码的那一次响应里返回，不落明文、不可再查。
  person:
    default-password: ${PERSON_DEFAULT_PASSWORD:Mentor@2026}

logging:
  level:
    com.graduation.mentor: info
    org.springframework.jdbc.datasource.init: warn
